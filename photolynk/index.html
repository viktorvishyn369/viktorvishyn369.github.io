<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhotoLynk — Get the app</title>
<meta name="description" content="Install PhotoLynk — photo certification and backup on Solana.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #040406;
    color: #EEEEF6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 400px;
    width: 100%;
    text-align: center;
    padding: 40px 28px;
    border-radius: 20px;
    background: rgba(129,140,248,0.06);
    border: 1px solid rgba(129,140,248,0.18);
  }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .sub { color: #8B8BA0; font-size: 14px; margin: 10px 0 28px; }
  a.btn {
    display: block;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    margin-bottom: 12px;
  }
  a.solana { background: linear-gradient(135deg, #9945FF, #14F195); color: #04040a; }
  a.store { background: rgba(255,255,255,0.08); color: #EEEEF6; border: 1px solid rgba(255,255,255,0.14); }
  .note { color: #5C5C72; font-size: 12px; margin-top: 20px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <h1>PhotoLynk</h1>
    <p class="sub">Certify &amp; protect your photos on Solana</p>
    <a class="btn solana" id="solana" href="solanadappstore://details?id=com.photolynk.solana">Open in Solana dApp Store</a>
    <a class="btn store" href="https://play.google.com/store/apps/details?id=com.photosync.app">Get it on Google Play</a>
    <a class="btn store" href="https://apps.apple.com/app/photolynk/id6748285696">Download on the App Store</a>
    <p class="note">On a Solana phone this page opens the dApp Store automatically.<br>Everyone else lands on Google Play.</p>
  </div>
<script>
  (function () {
    var deep = 'solanadappstore://details?id=com.photolynk.solana';
    var play = 'https://play.google.com/store/apps/details?id=com.photosync.app';
    var ua = navigator.userAgent || '';
    var isAndroid = /Android/i.test(ua);
    // Solana phones: fire the store deep link. Any failure = not a Solana
    // phone, so fall back to Google Play.
    if (isAndroid) {
      var fellBack = false;
      setTimeout(function () {
        if (!fellBack && !document.hidden) window.location.href = play;
      }, 1600);
      try { window.location.href = deep; fellBack = true; } catch (e) {}
      // If the dApp Store didn't take over, the page is still visible.
      setTimeout(function () { if (!document.hidden) window.location.href = play; }, 2200);
    }
  })();
</script>
</body>
</html>
