<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blipp — Solana dApp Store</title>
<meta name="description" content="Get Blipp, the private on-device voice AI, on the Solana dApp Store.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0e14;
    color: #e8ecf4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card { max-width: 420px; width: 100%; text-align: center; }
  .dot {
    width: 64px; height: 64px; margin: 0 auto 20px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #7aa2ff, #4f6ef7 60%, #2c3f9e);
    box-shadow: 0 0 40px rgba(79, 110, 247, .45);
  }
  h1 { font-size: 28px; letter-spacing: .5px; margin-bottom: 8px; }
  p.sub { color: #9aa5bd; font-size: 15px; line-height: 1.5; margin-bottom: 28px; }
  a.btn {
    display: block;
    padding: 16px 20px;
    border-radius: 14px;
    background: linear-gradient(135deg, #4f6ef7, #7aa2ff);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 12px;
  }
  a.btn:active { opacity: .85; }
  .alt { font-size: 13px; color: #9aa5bd; margin-top: 20px; line-height: 1.6; }
  .alt a { color: #7aa2ff; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>Blipp</h1>
    <p class="sub">Your private, on-device voice AI for Solana&nbsp;Seeker.</p>

    <a class="btn" id="storeBtn" href="solanadappstore://details?id=ai.blipp.solana">
      Open in Solana dApp Store
    </a>

    <p class="alt" id="fallback">
      On a Solana Seeker, the button above opens the store listing automatically.<br>
      Other Android? <a href="https://play.google.com/store/apps/details?id=ai.blipp">Get Blipp on Google Play</a>
    </p>
  </div>

<script>
  // Hand off to the Solana dApp Store when the scheme resolves (Seeker).
  // Browsers keep the page visible when no handler exists, so the fallback
  // text below stays useful on desktop / non-Seeker devices.
  window.addEventListener('load', function () {
    var t = setTimeout(function () {
      window.location.href = 'solanadappstore://details?id=ai.blipp.solana';
    }, 350);
    document.getElementById('storeBtn').addEventListener('click', function () {
      clearTimeout(t);
    });
  });
</script>
</body>
</html>
